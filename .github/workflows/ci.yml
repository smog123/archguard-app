name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build SDK
        run: npm run build -w packages/sdk

      - name: Test SDK
        run: npm test -w packages/sdk

      - name: Test indexer
        run: npm test -w indexer

      - name: Build web app
        run: npm run build -w apps/web
